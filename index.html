<!doctype html>
<html lang="es">
<head>
<base target="_top">
<script src="config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Llobera Boix">
<meta name="theme-color" content="#1d1d1b">
<title>Llobera Boix & Asoc.</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<style>
:root{
 --bg:#f2f2f2;--card:#fff;--ink:#1d1d1b;--ink2:#4d4d4d;--muted:#8a8a8a;--line:#e3e3e3;--soft:#ececec;--dark:#1d1d1b;
 /* gama de grises del estudio */
 --g1:#1d1d1b;--g2:#4d4d4d;--g3:#8a8a8a;--g4:#b3b3b3;--g5:#c4c4c4;--g6:#d9d9d9;--g7:#ececec;--g8:#f2f2f2;
 --grad:linear-gradient(110deg,#1d1d1b 0%,#4d4d4d 62%,#8a8a8a 100%);
 /* gama de rubros del estudio */
 --red:#d62828;--red-t:#fbeaea;--blue:#1f5fbf;--blue-t:#e8eef9;--yel:#f2c200;--yel-t:#fdf5d6;--yel-d:#8a6d00;
 --green:#2e9e4f;--green-t:#e6f4ea;--brown:#c8a27a;--brown-t:#f6eee5;--brown-d:#8a6440;
 --r:16px;--side:240px;--tab:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation}
body{margin:0;background:var(--bg);font-family:Montserrat,Arial,sans-serif;color:var(--ink);font-size:14px;-webkit-text-size-adjust:100%}
button{font-family:inherit}
a{color:inherit}
.muted{color:var(--muted);font-size:12px}
.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.5px}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{cursor:pointer;user-select:none;line-height:1}
.logo b{display:block;font-size:21px;font-weight:700;letter-spacing:-1px}
.logo span{display:block;font-size:10px;letter-spacing:3px;margin-top:3px;color:var(--muted)}
.logo .ver{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.5px;vertical-align:top;margin-left:6px;padding:2px 6px;border-radius:100px;background:var(--g7);color:var(--g2);position:relative;top:2px}
.side .logo .ver,.top .logo .ver{background:#ffffff22;color:#fff}

/* botones */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:100px;padding:9px 15px;font:600 12px Montserrat,Arial;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#c9c9c7}
.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}
.btn.sm{padding:6px 11px;font-size:11px}
.btn.icon{padding:8px;border-radius:50%}

/* layout web */
#app{display:none;min-height:100vh}
.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);background:linear-gradient(180deg,#1d1d1b 0%,#2c2c2a 55%,#4d4d4d 100%);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.side .logo{padding:4px 10px 18px}
.side .logo span{color:var(--g4)}
.side .navi{color:var(--g5)}
.side .navi:hover{background:#ffffff14;color:#fff}
.side .navi.on{background:var(--g7);color:var(--g1)}
.navi{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:13px;border:0;background:none;width:100%;text-align:left}
.navi:hover{background:var(--soft)}
.navi.on{background:var(--dark);color:#fff}
.navi .badge{margin-left:auto}
.side .grow{flex:1}
.drivebtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#ffffff14;color:#fff;border:1px solid #ffffff22;font-weight:700;font-size:12px;text-decoration:none}
.yo{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);margin-top:8px}
.side .yo{border-top-color:#ffffff22}.side .yo .l{color:var(--g4)}.side .yo .ava{background:var(--g7);color:var(--g1)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.yo .n{font-size:12px;font-weight:700}
.yo .l{font-size:11px;color:var(--muted)}
.yo .l a{cursor:pointer;text-decoration:underline;margin-right:8px}
main{margin-left:var(--side);padding:28px 34px 60px;max-width:1300px}
.top{display:none}
.tabbar{display:none}
.badge{background:var(--red);color:#fff;border-radius:100px;font-size:10px;font-weight:700;padding:2px 7px}

/* encabezado de página */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.phead .sub{color:var(--muted);font-size:15px;font-weight:500}
/* encabezado gris de Inicio */
.hero{background:var(--grad);color:#fff;border-radius:20px;padding:24px 26px;margin-bottom:18px}
.hero .phead{margin:0}
.hero .eyebrow{color:var(--g5)}
.hero .phead .sub{color:var(--g6)}
.hero .btn{background:#ffffff1a;border-color:#ffffff33;color:#fff}
.hero .btn.dark{background:#fff;color:var(--g1);border-color:#fff}
.card .ch>svg.i{color:var(--g3)}
/* asistente */
#fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;border:0;background:var(--grad);color:#fff;box-shadow:0 6px 20px #0003;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:30}
#fab svg{width:24px;height:24px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{max-width:85%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.yo{align-self:flex-end;background:var(--g1);color:#fff;border-bottom-right-radius:5px}
.msg.ia{align-self:flex-start;background:var(--g7);color:var(--g1);border-bottom-left-radius:5px}
.msg.pensando{color:var(--g3);font-style:italic}
.accion{align-self:flex-start;max-width:85%;background:#fff;border:1px solid var(--g6);border-left:4px solid var(--g2);border-radius:12px;padding:12px 14px;font-size:13px}
.accion .acts{margin-top:10px}
.accion.hecha{opacity:.55}
.sug{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.sug button{border:1px solid var(--g6);background:#fff;border-radius:100px;padding:8px 13px;font-size:12px;font-weight:600;color:var(--g2);cursor:pointer}
.chatbox{display:flex;gap:8px;align-items:flex-end;margin-top:14px;position:sticky;bottom:12px;background:#fff;padding-top:6px}
.chatbox textarea{min-height:48px;max-height:140px;border-radius:14px}
.chatbox .btn{height:48px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card .ch{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card .ch .acts{margin-left:auto}
.tip{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--ink2);line-height:1.5;margin-bottom:14px}
.tip b{color:var(--ink)}
.stat{display:flex;align-items:center;gap:12px}
.stat .num{font-size:28px;font-weight:700}
.stat .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}

/* chips de color */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:4px 9px;border-radius:100px;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.chip.plain::before{display:none}
.st-Sin{background:var(--g6);color:var(--g2)}
.st-Por{background:var(--yel-t);color:var(--yel-d)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--g6);background:#fff;border-radius:100px;padding:4px 12px 4px 4px;font:600 12px Montserrat,Arial;color:var(--g2);cursor:pointer}
.pk.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.pk:disabled{cursor:default}
.ava.sm{width:24px;height:24px;font-size:10px;color:#fff}
.checklist{display:grid;gap:6px}
/* chat interno */
.chatw{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.chatw .cl{padding:12px;max-height:72vh;overflow:auto}
.chatw .cc{display:flex;flex-direction:column;min-height:60vh;max-height:76vh}
.cv{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;cursor:pointer}
.cv:hover{background:var(--g8)}.cv.on{background:var(--g7)}
.cv .ava{color:#fff}
.cv .tx{flex:1;min-width:0}.cv .tt{font-weight:700;font-size:13px}.cv .tm{font-size:11px;color:var(--g3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px 2px;min-height:200px}
.bm{max-width:78%;align-self:flex-start;background:var(--g7);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.bm b{display:block;font-size:11px;margin-bottom:2px}
.bm small{display:block;text-align:right;font-size:10px;color:var(--g3);margin-top:2px}
.bm.yo{align-self:flex-end;background:var(--g1);color:#fff;border-radius:14px 14px 4px 14px}
.bm.yo small{color:var(--g4)}
.sepd{align-self:center;font-size:10px;color:var(--g3);text-transform:uppercase;letter-spacing:1px;margin:8px 0 2px}
.chatw .volver{display:none}
/* turnos */
.turnos{overflow-x:auto}
.tr{display:grid;grid-template-columns:120px repeat(6,minmax(78px,1fr));gap:5px;margin-bottom:5px;min-width:600px}
.tr.th div{font-size:11px;color:var(--g3);text-align:center;padding:4px;font-weight:600}
.tr.th div.hoy{color:var(--g1);background:var(--g7);border-radius:8px}
.tp{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.tc{position:relative;height:44px;border-radius:10px;border:1px solid var(--g6);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:10px;font-weight:700;color:var(--g2)}
.tc span{position:relative;z-index:1;background:#ffffffd9;border-radius:6px;padding:1px 6px}
.tc.td{background:var(--c);border-color:transparent}
.tc.tm{background:linear-gradient(90deg,var(--c) 50%,#fff 50%)}
.tc.tt{background:linear-gradient(90deg,#fff 50%,var(--c) 50%)}
.tc.tv{background:repeating-linear-gradient(135deg,var(--g7) 0 6px,#fff 6px 12px);color:var(--g3)}
.tc.tn{color:var(--g5)}
.tc.camb{box-shadow:inset 0 0 0 2px var(--g1)}
.tc i{position:absolute;bottom:2px;right:5px;font-size:8px;font-style:normal;z-index:1;color:var(--g1)}
.cev.ini{border-left-color:var(--g3);background:#fff;color:var(--g2)}
/* reuniones */
.agenda{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start}
.ag-d{width:62px;flex:none;text-align:center;background:var(--g1);color:#fff;border-radius:14px;padding:10px 4px}
.ag-d b{display:block;font-size:22px;line-height:1}
.ag-d small{display:block;font-size:10px;color:var(--g5);text-transform:capitalize;margin-top:3px}
.ag-d em{display:block;font-size:10px;font-style:normal;font-weight:700;margin-top:4px;color:var(--yel)}
.task .hora{font-weight:700;font-size:13px;min-width:44px;color:var(--g1)}
.avs{display:flex;gap:2px;align-items:center}
.busca{position:relative}
.busca-l{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--g6);border-radius:12px;max-height:240px;overflow:auto;z-index:5;box-shadow:0 8px 24px #0002}
.busca-l .op{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--g7)}
.busca-l .op:hover{background:var(--g8)}
.busca-l .op.nuevo{color:var(--blue);font-weight:700}
.busca-l .op.vacio{color:var(--g3);cursor:default}
.ck{display:grid;grid-template-columns:24px 1fr 34px;align-items:center;gap:8px;background:var(--g8);border-radius:10px;padding:4px 6px 4px 10px}
.ck input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);margin:0;padding:0}
.ck .ck-t{border:0;background:transparent;padding:8px 4px;font-size:15px}
.ck.ok .ck-t{text-decoration:line-through;color:var(--g3)}
.ck .x{border:0;background:none;font-size:20px;color:var(--g3);cursor:pointer}
.prog{display:flex;align-items:center;gap:8px;margin-top:6px;max-width:220px}
.prog .bar{flex:1;height:5px}
.prog span{font-size:10px;font-weight:700;color:var(--g3)}
.st-En{background:var(--blue-t);color:var(--blue)}
.st-Terminado{background:var(--green-t);color:var(--green)}
.pr-Alta{background:var(--red-t);color:var(--red)}
.pr-Media{background:var(--yel-t);color:var(--yel-d)}
.pr-Baja{background:var(--brown-t);color:var(--brown-d)}
.t-red{background:var(--red-t);color:var(--red)}.t-blue{background:var(--blue-t);color:var(--blue)}.t-yel{background:var(--yel-t);color:var(--yel-d)}.t-green{background:var(--green-t);color:var(--green)}.t-brown{background:var(--brown-t);color:var(--brown-d)}

/* filas de tarea */
.list{display:grid;gap:8px}
.task{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}
.task:hover{border-color:#cfcfcd}
.task .dot{width:10px;height:10px;border-radius:50%;flex:none}
.task .tx{flex:1;min-width:0}
.task .tt{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .tm{font-size:11px;color:var(--muted);margin-top:3px}
.task .due{font-size:11px;font-weight:700;white-space:nowrap;color:var(--ink2)}
.task .due.v{color:var(--red)}.task .due.h{color:var(--blue)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.grp{display:flex;align-items:center;gap:8px;margin:14px 0 8px;cursor:pointer;user-select:none}
.grp .n{font-size:11px;color:var(--muted)}
.grp svg{transition:transform .15s}
.grp.closed svg{transform:rotate(-90deg)}
.empty{color:var(--muted);font-size:12px;padding:10px 2px}

/* formularios */
select,input,textarea{padding:10px 12px;border:1px solid #dcdcda;border-radius:10px;background:#fff;font-family:inherit;font-size:16px;width:100%;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{width:auto;font-size:13px;padding:8px 12px;border-radius:100px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--soft);border-radius:100px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:100px;padding:8px 16px;font-weight:600;font-size:12px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0001}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.wd{border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;border:1px solid transparent}
.wd small{display:block;font-size:10px;color:var(--muted);text-transform:capitalize}
.wd b{display:block;font-size:17px;margin-top:2px}
.wd i{display:block;height:5px;margin-top:4px;font-style:normal}
.wd i span{display:inline-block;width:5px;height:5px;border-radius:50%;margin:0 1px}
.wd.on{background:var(--dark);color:#fff}.wd.on small{color:#ccc}
.wd.hoy{border-color:var(--dark)}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dn{font-size:10px;font-weight:700;color:var(--muted);text-align:center;padding:4px}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;cursor:pointer;overflow:hidden}
.cal .d.fuera{opacity:.4}
.cal .d.hoy{border:2px solid var(--dark)}
.cal .n{font-size:11px;font-weight:700}
.cev{display:block;font-size:10px;padding:2px 6px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--muted);background:var(--soft)}
.cev.ev{border-left-color:var(--blue);background:var(--blue-t);color:var(--blue)}
.cev.Alta{border-left-color:var(--red)}.cev.Media{border-left-color:var(--yel)}.cev.Baja{border-left-color:var(--brown)}
.cev.term{text-decoration:line-through;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin:10px 0}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}

/* gantt */
.gantt{overflow-x:auto}
.g-row{display:grid;grid-template-columns:210px 1fr;align-items:center;min-width:660px;border-bottom:1px solid #f1f1ef}
.g-lab{font-size:12px;font-weight:600;padding:9px 10px 9px 0}
.g-lab small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:2px}
.g-track{position:relative;height:34px}
.g-bar{position:absolute;top:8px;height:18px;border-radius:6px;overflow:hidden;cursor:pointer}
.g-bar i{display:block;height:100%}
.g-hoy{position:absolute;top:0;bottom:0;width:2px;background:var(--red);opacity:.6}
.g-head{display:grid;grid-template-columns:210px 1fr;min-width:660px}
.g-weeks{position:relative;height:22px;font-size:9px;color:var(--muted)}
.g-weeks span{position:absolute;top:4px;border-left:1px solid #e3e3e1;padding-left:3px}
.bar{height:6px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}

/* persona (cronograma diario) */
.persona{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.persona .ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}

/* obras */
.obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.obra .oc{font-size:15px;font-weight:700;margin:10px 0 2px}

/* tabla */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#f5f5f4 0%,#e9e9e7 100%)}
#login .card{width:100%;max-width:400px;padding:28px}
#login .logo{margin-bottom:22px}
#login .seg{width:100%;margin-bottom:6px}#login .seg button{flex:1}

/* modal y avisos */
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
#modal .box{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:620px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:100px;font-size:12px;display:none;max-width:90vw;z-index:60}
#cargando{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--yel),var(--green),var(--blue));display:none;z-index:70}
.img-prev{max-width:100%;border-radius:10px;margin-top:8px}
ul.items{margin:6px 0 0 18px;padding:0;font-size:12px}
#mas{position:fixed;inset:0;background:#0006;display:none;z-index:40;align-items:flex-end}
#mas .sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}

/* registros */
.rg-top{align-items:center;margin-bottom:16px}
.rg-top select{max-width:260px}
.rg-grab{text-align:center;padding:10px 0 4px}
.rg-rec{width:112px;height:112px;border-radius:50%;border:0;background:var(--dark);color:#fff;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center}
.rg-rec svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rg-rec .cuadro{width:32px;height:32px;background:#fff;border-radius:6px;display:none}
.rg-rec.on .mic{display:none}.rg-rec.on .cuadro{display:block}
.rg-rec.on::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--red);animation:rgpulso 1.4s ease-out infinite}
@keyframes rgpulso{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.18);opacity:0}}
.rg-rec:disabled{opacity:.35}
.rg-rt{margin-top:12px;font-weight:700;font-size:14px}
.rg-msg{margin-top:12px;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.45}
.rg-msg.ok{background:var(--green-t);color:#1d5e31}.rg-msg.err{background:var(--red-t);color:#8f1b1b}
.rg-msg a{font-weight:700}
.rg-ed{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;background:#fff}
.rg-ed h3{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink2);margin:16px 0 6px}
.rg-it{display:grid;grid-template-columns:1fr 38px;gap:6px;margin-bottom:8px}
.rg-it textarea{min-height:44px;font-size:14px;padding:9px 11px}
.rg-it .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rg-it .meta input{font-size:13px;padding:8px 10px}
.rg-it .x{border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--muted);font-size:16px;cursor:pointer;height:44px}
.rg-mas{background:none;border:0;color:var(--ink2);font-size:12px;font-weight:700;padding:2px 0;cursor:pointer}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:500;line-height:1.4;color:var(--ink2);margin:10px 0 0;cursor:pointer}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--dark);flex:none;padding:0}
.chk b{color:var(--ink)}
.rg-nota .tt{white-space:normal}
.rg-nota .tm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- v5 ---------- */
/* que nada estire la página a lo ancho (registros, links largos) */
.grid>*,.form2>*{min-width:0}
.rg-msg,.tip,.task .tm,.muted{overflow-wrap:anywhere}
main{min-width:0}
/* ejemplo de cronograma de obra */
.g-ej{opacity:.6}
.g-ej .g-bar{cursor:default}
.ej-tip .chip{background:var(--g1);color:#fff;font-size:10px;letter-spacing:1px;margin-right:4px}
/* pantalla de arranque (con sesión guardada no se muestra el ingreso) */
#splash{display:none;position:fixed;inset:0;z-index:95;background:linear-gradient(160deg,#f5f5f4 0%,#e9e9e7 100%);flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;text-align:center}
body.arranca #splash{display:flex}
body.arranca #login,body.arranca #app,body.arranca #tabbar{display:none!important}
.sp-bar{width:140px;height:3px;border-radius:3px;background:#d9d9d6;overflow:hidden}
.sp-bar i{display:block;width:40%;height:100%;background:var(--g1);border-radius:3px;animation:spMove 1.1s ease-in-out infinite}
@keyframes spMove{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.sp-err{display:none;font-size:13px;color:var(--g2);line-height:1.8}
.sp-err.on{display:block}
/* cartel de bienvenida */
#bienv{position:fixed;inset:0;z-index:99;background:#1d1d1bcc;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;animation:bvIn .35s ease}
#bienv.fuera{opacity:0;transition:opacity .35s;pointer-events:none}
.bv-card{z-index:1}
@keyframes bvIn{from{opacity:0}to{opacity:1}}
.bv-conf{position:absolute;inset:0;pointer-events:none}
.bv-conf i{position:absolute;top:-20px;width:9px;height:9px;border-radius:2px;opacity:.95;animation:bvCae linear infinite}
@keyframes bvCae{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
.bv-card{position:relative;background:#fff;border-radius:22px;padding:30px 26px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px #0005;animation:bvSube .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes bvSube{from{transform:translateY(40px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.bv-card h1{font-size:26px;margin:6px 0 10px}
.bv-card p{line-height:1.55;color:var(--g2);margin:0 0 12px}
.bv-card ul{margin:0 0 20px;padding-left:18px;line-height:1.8;font-size:13px;color:var(--g2)}
.bv-card .btn{width:100%;justify-content:center;padding:13px;font-size:14px}
.bv-v{display:inline-block;margin-top:18px;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;background:var(--g1);color:#fff;border-radius:100px;padding:5px 11px}
/* adjuntos */
.adj{display:grid;gap:6px;margin-bottom:8px}
.adj-f{display:flex;align-items:center;gap:10px;background:var(--g8);border-radius:10px;padding:8px 10px;font-size:13px}
.adj-f .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;cursor:pointer}
.adj-f .x{border:0;background:none;font-size:20px;color:var(--g3);cursor:pointer;padding:0 4px}
.adj-f .pb{flex:0 0 90px}
.guardando{font-size:12px;color:var(--g3);font-weight:600}
/* fotos en obra */
.fo-dest{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 4px}
.fo-dest button{border:1px solid var(--g6);background:#fff;border-radius:12px;padding:12px 4px;font:700 11px Montserrat,Arial;letter-spacing:.5px;color:var(--g2);cursor:pointer}
.fo-dest button.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.fo-big{display:flex;gap:10px;margin-top:14px}
.fo-big label,.fo-big button{flex:1;justify-content:center;padding:16px 10px;font-size:13px;margin:0;border-radius:14px}
.fo-it{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--g7)}
.fo-it .th{width:44px;height:44px;border-radius:8px;background:var(--g7) center/cover;display:flex;align-items:center;justify-content:center;color:var(--g3)}
.fo-it .nm{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fo-it .st{font-size:11px;color:var(--g3);margin-top:3px}
.fo-it .bar{margin-top:5px}
.fo-it.err .st{color:var(--red)}
.fo-it.ok .st{color:var(--green)}
/* cronograma obra semanal */
.os-dia{margin-bottom:14px}
.os-dia>.dh{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}
.os-dia>.dh b{font-size:13px;text-transform:capitalize}
.os-dia.hoy>.dh b{color:var(--blue)}
.os{display:grid;grid-template-columns:26px 1fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;align-items:start}
.os input[type=checkbox]{width:22px;height:22px;margin:0;padding:0;accent-color:var(--green)}
.os .tt{font-weight:600;font-size:13px;line-height:1.4;cursor:pointer}
.os .tm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.os.ok .tt{text-decoration:line-through;color:var(--muted)}
/* documentos */
.dc-tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.dc-t{cursor:pointer;transition:border-color .15s}
.dc-t:hover{border-color:var(--g4)}
.dc-t .n{font-size:15px;font-weight:700;margin:10px 0 4px}
.dc-t.prox{cursor:default;opacity:.6}
.dc-form{max-width:860px}
.dc-form h3{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink2);margin:22px 0 4px}
.dc-row{display:grid;grid-template-columns:var(--cols) 38px;gap:6px;margin-bottom:6px}
.dc-row input{font-size:14px;padding:8px 10px}
.dc-row .x{border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--muted);font-size:16px;cursor:pointer;height:38px}
.dc-tab{width:100%;border-collapse:separate;border-spacing:0 6px}
.dc-tab td{padding:0 4px 0 0;border:0;vertical-align:top}
.dc-tab th{padding:0 4px 2px 0;border:0}
.dc-tab input,.dc-tab textarea{font-size:14px;padding:8px 10px}
.dc-tab textarea{min-height:40px}
.dc-tab .x{border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--muted);font-size:16px;cursor:pointer;height:38px;width:38px}
.dc-bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);z-index:4}
.dc-num{font-size:12px;font-weight:700;background:var(--g7);border-radius:100px;padding:6px 12px;display:inline-block}
.ayuda{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:14px}
.ayuda div{background:var(--g8);border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.5;color:var(--g2)}
.ayuda b{display:block;color:var(--g1);margin-bottom:3px;font-size:13px}
.rg-tipo{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rg-doc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rg-rec.chico{width:84px;height:84px}
.rg-rec.chico svg{width:32px;height:32px}

/* ---------- celular ---------- */
@media(max-width:900px){
 .side{display:none}
 main{margin-left:0;padding:16px 16px calc(var(--tab) + 28px + env(safe-area-inset-bottom))}
 .top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:6;background:var(--grad);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
 .top .logo span{color:var(--g5)}
 .top .btn.icon{background:#ffffff1a;border-color:#ffffff33;color:#fff}
 .top .ava{background:var(--g7);color:var(--g1);border:0}
 .top .logo b{font-size:18px}
 .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
 .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;font-size:10px;font-weight:600;color:var(--muted);position:relative}
 .tabbar button.on{color:var(--ink)}
 .tabbar button.on svg{stroke-width:2.4}
 .tabbar .badge{position:absolute;top:4px;right:calc(50% - 20px);font-size:9px;padding:1px 5px}
 h1{font-size:23px}
 .phead{margin-bottom:16px}
 .grid{grid-template-columns:1fr}
 .c4,.c5,.c6,.c7,.c8,.c12{grid-column:auto}
 .form2{grid-template-columns:1fr}
 .cal .d{min-height:56px;padding:4px}
 .cev{font-size:0;height:5px;padding:0;margin-top:3px;border-left:0;background:var(--muted)}
 .cev.ev{background:var(--blue)}.cev.Alta{background:var(--red)}.cev.Media{background:var(--yel)}.cev.Baja{background:var(--brown)}.cev.term{background:#ddd}
 .task{flex-wrap:wrap;row-gap:6px}
 .task .tx{flex:1 1 calc(100% - 24px)}
 .task .tt{white-space:normal}
 .task .tm{white-space:normal}
 .task .chip{margin-left:22px}
 .task .due{margin-left:auto}
 main{overflow-x:hidden}
 #modal{padding:0;align-items:flex-end}
 #modal .box{border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
 .acts .btn .lbl{display:none}
 .hero{padding:18px;border-radius:16px}
 #fab{bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom));right:16px;width:52px;height:52px}
 .chatbox{bottom:calc(var(--tab) + 10px + env(safe-area-inset-bottom))}
 .msg,.accion{max-width:92%}
 .chatw{grid-template-columns:1fr}
 .chatw.abierta .cl{display:none}
 .chatw:not(.abierta) .cc{display:none}
 .chatw .volver{display:inline-flex}
 .chatw .cc{min-height:calc(100vh - 300px)}
 .tr{grid-template-columns:90px repeat(6,minmax(64px,1fr))}
 .grid.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .stats .card{padding:12px 10px}
 .stats .stat{flex-direction:column;align-items:flex-start;gap:8px}
 .stats .stat .ic{width:32px;height:32px;border-radius:10px}
 .stats .stat .num{font-size:22px}

 .grid,.grid.stats{grid-template-columns:minmax(0,1fr)}
 .grid.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
 .rg-top select{max-width:none;flex:1 1 100%}
 .fo-dest{grid-template-columns:repeat(2,minmax(0,1fr))}
 .dc-bar{bottom:calc(var(--tab) + env(safe-area-inset-bottom));padding:10px 0}
 .dc-bar .btn{flex:1;justify-content:center}
 .dc-row{grid-template-columns:1fr 1fr 38px;background:var(--g8);padding:6px;border-radius:12px}
 .dc-row>input:first-child{grid-column:1/-1}
}

/*

 */
var API_URL = /^https:\/\/[^\s]+$/.test(window.LLB_API_URL || '') && !/PEGAR/.test(window.LLB_API_URL) ? window.LLB_API_URL : '';

  return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) {

/* ---- Inicio: lo de hoy en obra ---- */

/* ---------- almacenamiento en el celular (IndexedDB) ----------
 * Guarda las fotos que faltan subir y los pedazos de las grabaciones, para que nada se pierda
 * si se corta la señal, entra una llamada o se cierra la app.
 */
var IDB = (function () {
  var db = null, abriendo = null;
  function abrir() {
    if (db) return Promise.resolve(db);

    abriendo = new Promise(function (ok, mal) {
      if (!window.indexedDB) return mal(new Error('sin almacenamiento'));
      var r;
      try { r = indexedDB.open('llobera', 1); } catch (e) { return mal(e); }
      r.onupgradeneeded = function () {
        var d = r.result;
        if (!d.objectStoreNames.contains('fotos')) d.createObjectStore('fotos', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('grab')) d.createObjectStore('grab', { keyPath: 'k' });
      };
      r.onsuccess = function () { db = r.result; db.onclose = function () { db = null; }; ok(db); };
      r.onerror = function () { mal(r.error); };

  }
  function tx(store, modo, fn) {

    get: function (s, k) { return tx(s, 'readonly', function (st) { return st.get(k); }); },
    del: function (s, k) { return tx(s, 'readwrite', function (st) { return st.delete(k); }); },
    all: function (s) { return tx(s, 'readonly', function (st) { return st.getAll(); }); },

    borrarRango: function (s, a, b) { return tx(s, 'readwrite', function (st) { return st.delete(IDBKeyRange.bound(a, b)); }); }

})();

/* ---------- subida de archivos por partes (fotos, videos, PDF, Word, Excel) ----------
 * Partes de 4 MB directo al Drive. Si se corta, pregunta hasta dónde llegó y sigue desde ahí.
 * reg guarda el estado (clave, desde, idCliente) para poder retomar aunque se cierre la app.
 */
var PARTE_SUBIDA = 4 * 1024 * 1024;
function leerB64(blob) {
  return new Promise(function (ok, mal) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(',')[1] || ''); }; r.onerror = function () { mal(r.error || new Error('No se pudo leer el archivo')); }; r.readAsDataURL(blob); });
}
function esperarConexion(ms) {
  return new Promise(function (ok) {
    var h, fin = function () { window.removeEventListener('online', fin); clearTimeout(h); ok(); };
    window.addEventListener('online', fin);
    h = setTimeout(fin, navigator.onLine === false ? 120000 : ms);
  });
}
async function subirArchivo(file, destino, progreso, reg) {
  reg = reg || {};
  if (!reg.idCliente) reg.idCliente = uid();
  var total = file.size, intentos = 0;
  if (!total) throw new Error('El archivo está vacío.');
  while (true) {
    try {
      if (!reg.clave) {
        var ini = await gs('iniciarSubida', [S.token, destino, reg.nombre || file.name || 'archivo', reg.mime || file.type || '', total, reg.idCliente]);
        if (ini.listo) return ini.archivo;
        reg.clave = ini.clave; reg.desde = 0; reg.nombreFinal = ini.nombre;
        if (reg.guardar) reg.guardar();
      }
      while (true) {
        var desde = reg.desde || 0, hasta = Math.min(desde + PARTE_SUBIDA, total);
        var b64 = await leerB64(file.slice(desde, hasta));
        var r = await gs('subirParte', [S.token, reg.clave, b64, desde]);
        intentos = 0;
        if (r.listo) { if (progreso) progreso(100); return r.archivo; }
        reg.desde = r.recibido;
        if (progreso) progreso(Math.min(99, Math.round(reg.desde / total * 100)));
        if (reg.guardar) reg.guardar();
      }
    } catch (e) {
      var m = (e && e.message) || String(e);
      if (/SESION|vacío|demasiado grande|no válid|Obra no/.test(m)) throw e;
      if (/venció/.test(m)) { reg.clave = null; reg.desde = 0; if (++intentos > 8) throw e; continue; }
      if (++intentos > 8) throw new Error('No hay conexión estable (' + m + ')');
      if (reg.alReintentar) reg.alReintentar(intentos);
      await esperarConexion(Math.min(30000, 1500 * Math.pow(2, intentos)));
      if (reg.clave) {
        try {
          var st = await gs('estadoSubida', [S.token, reg.clave]);
          if (st.vencida) { reg.clave = null; reg.desde = 0; }
          else if (st.listo) return st.archivo;
          else reg.desde = st.recibido;
        } catch (x) { /* sin señal todavía: vuelve a probar */ }
      }
    }
  }
}

/* ---------- cola de fotos en obra ----------
 * Cada foto/video queda guardado en el celular hasta que el Drive confirma que lo recibió.
 * Sube de a uno; si se corta la señal espera y sigue; si se cierra la app, sigue al volver a abrirla.
 */
var FQ = (function () {
  var cola = [], andando = false, iniciado = false;
  var MAX_GUARDAR = 400 * 1024 * 1024;          // los videos más grandes se suben sin copia en el celular
  function copia(it) { return { id: it.id, file: it.file, nombre: it.nombre, mime: it.mime, tam: it.tam, destino: it.destino, obraNom: it.obraNom, estado: it.estado === 'subiendo' ? 'pendiente' : it.estado, clave: it.clave || null, desde: it.desde || 0, idCliente: it.idCliente, error: it.error || '', creado: it.creado }; }
  function guardar(it) { if (!it.persistido) return Promise.resolve(); return IDB.put('fotos', copia(it)).catch(function () {}); }
  function falta() { return cola.filter(function (x) { return x.estado !== 'listo'; }).length; }
  function avisar() { pintarNav(); if (S.vista === 'fotos') pintarLista(); }
  function agregar(files, destino, obraNom) {
    var nuevos = Array.prototype.map.call(files, function (f) {
      var id = uid();
      return { id: id, idCliente: id, file: f, nombre: f.name || ('foto.' + (/video/.test(f.type) ? 'mp4' : 'jpg')), mime: f.type || '', tam: f.size, destino: destino, obraNom: obraNom, estado: 'pendiente', pct: 0, creado: Date.now() };
    }).filter(function (it) { if (!it.tam) { toast(it.nombre + ' está vacío.'); return false; } return true; });
    if (!nuevos.length) return;
    nuevos.forEach(function (it) { cola.push(it); });
    toast(nuevos.length === 1 ? 'Subiendo 1 archivo…' : 'Subiendo ' + nuevos.length + ' archivos…');
    avisar();
    var sinCopia = 0;
    nuevos.reduce(function (p, it) {
      return p.then(function () {
        if (it.tam > MAX_GUARDAR) { sinCopia++; return; }
        return IDB.put('fotos', copia(it)).then(function () { it.persistido = true; }, function () { sinCopia++; });
      });
    }, Promise.resolve()).then(function () { if (sinCopia) toast('Dejá la app abierta hasta que termine de subir (' + sinCopia + (sinCopia === 1 ? ' archivo grande).' : ' archivos grandes).')); });
    procesar();
  }
  async function procesar() {
    if (andando || !S.token) return;
    andando = true;
    try {
      while (true) {
        var it = cola.find(function (x) { return x.estado === 'pendiente'; });
        if (!it) break;
        it.estado = 'subiendo'; it.error = ''; it.reint = 0; avisar();
        it.guardar = function () { guardar(this); };
        it.alReintentar = function (n) { this.reint = n; pintarItem(this); };
        try {
          var r = await subirArchivo(it.file, it.destino, function (p) { it.pct = p; pintarItem(it); }, it);
          it.estado = 'listo'; it.pct = 100; it.url = r.url; it.nombreFinal = r.nombre;
          if (it.thumb) { URL.revokeObjectURL(it.thumb); it.thumb = null; }
          it.file = null;
          IDB.del('fotos', it.id).catch(function () {});
        } catch (e) {
          var m = (e && e.message) || String(e);
          if (/SESION/.test(m)) { it.estado = 'pendiente'; cerrar(true); toast('La sesión venció. Volvé a entrar: las fotos siguen guardadas.'); break; }
          it.estado = 'error'; it.error = m; guardar(it);
        }
        avisar();
      }
    } finally { andando = false; avisar(); }
  }
  function arrancar() {
    if (iniciado) { procesar(); return; }
    iniciado = true;
    window.addEventListener('online', function () { cola.forEach(function (x) { if (x.estado === 'error') x.estado = 'pendiente'; }); procesar(); });
    setInterval(function () { if (!andando && cola.some(function (x) { return x.estado === 'pendiente'; })) procesar(); }, 60000);
    IDB.all('fotos').then(function (lista) {
      (lista || []).forEach(function (r) {
        if (cola.some(function (x) { return x.id === r.id; })) return;
        r.persistido = true; r.estado = r.estado === 'error' ? 'error' : 'pendiente'; r.pct = r.tam ? Math.round((r.desde || 0) / r.tam * 100) : 0;
        cola.push(r);
      });
      if (lista && lista.length) toast('Retomando ' + lista.length + (lista.length === 1 ? ' archivo' : ' archivos') + ' sin subir…');
      procesar();
    }, function () {});
  }
  function reintentar(id) { cola.forEach(function (x) { if (x.estado === 'error' && (!id || x.id === id)) x.estado = 'pendiente'; }); procesar(); avisar(); }
  function quitar(id) {
    var it = cola.find(function (x) { return x.id === id; });
    if (!it || it.estado === 'subiendo') return;
    if (it.estado !== 'listo' && !window.confirm('¿Sacar ' + it.nombre + ' sin subirlo?')) return;
    cola.splice(cola.indexOf(it), 1); IDB.del('fotos', id).catch(function () {}); avisar();
  }
  function limpiar() { cola = cola.filter(function (x) { return x.estado !== 'listo'; }); avisar(); }
  function tam(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  function filaHtml(it) {
    if (!it.thumb && it.file && /^image\//.test(it.mime) && it.tam < 30 * 1048576) { try { it.thumb = URL.createObjectURL(it.file); } catch (e) {} }
    var st = it.estado === 'listo' ? '✓ Subida · ' + esc(it.nombreFinal || it.nombre) : it.estado === 'error' ? 'No se subió: ' + esc(it.error) : it.estado === 'subiendo' ? (it.reint ? 'Sin señal, reintentando (' + it.reint + ')…' : 'Subiendo ' + (it.pct || 0) + '% · ' + tam(it.tam)) : 'En espera · ' + tam(it.tam);
    return '<div class="fo-it ' + (it.estado === 'listo' ? 'ok' : it.estado === 'error' ? 'err' : '') + '" id="fq_' + it.id + '"><div class="th"' + (it.thumb ? ' style="background-image:url(' + it.thumb + ')"' : '') + '>' + (it.thumb ? '' : ic(/video/.test(it.mime) ? 'camara' : 'doc', 18)) + '</div>' +
      '<div style="min-width:0"><div class="nm">' + esc(it.obraNom || '') + ' · ' + esc(it.destino && it.destino.sub || '') + ' · ' + esc(it.nombre) + '</div><div class="st">' + st + '</div>' +
      (it.estado === 'subiendo' || it.estado === 'pendiente' ? '<div class="bar"><i style="width:' + (it.pct || 0) + '%;background:var(--blue)"></i></div>' : '') + '</div>' +
      '<div class="acts">' + (it.estado === 'listo' && it.url ? '<a class="btn icon sm" href="' + esc(it.url) + '" target="_blank" rel="noopener" title="Ver en Drive">' + ic('ext', 14) + '</a>' : '') +
      (it.estado === 'error' ? '<button class="btn sm" onclick="FQ.reintentar(\'' + it.id + '\')">Reintentar</button>' : '') +
      (it.estado !== 'subiendo' && it.estado !== 'listo' ? '<button class="btn icon sm" onclick="FQ.quitar(\'' + it.id + '\')" title="Sacar">' + ic('trash', 14) + '</button>' : '') + '</div></div>';
  }

    var el = $('foLista'); if (!el) return;
    var err = cola.filter(function (x) { return x.estado === 'error'; }).length, ok = cola.filter(function (x) { return x.estado === 'listo'; }).length;
    $('foCont').textContent = falta() ? 'Faltan ' + falta() : (cola.length ? 'Todo subido ✓' : '');
    el.innerHTML = cola.length ? cola.slice().reverse().map(filaHtml).join('') : '<div class="empty">Todavía no subiste nada en esta sesión.</div>';
    $('foAcc').innerHTML = (err ? '<button class="btn sm" onclick="FQ.reintentar()">Reintentar todo</button>' : '') + (ok ? '<button class="btn sm" onclick="FQ.limpiar()">Limpiar subidas</button>' : '');
  }
  return { agregar: agregar, arrancar: arrancar, pendientes: falta, reintentar: reintentar, quitar: quitar, limpiar: limpiar, pintarLista: pintarLista };
})();

/* archivos de una tarea (y la imagen vieja de v4) */
function adjuntosDe(t) { try { return JSON.parse(t.adjuntos || '[]') || []; } catch (e) { return []; } }
function abrirAdjunto(a) {
  if (a.url && !a.id) { window.open(a.url, '_blank', 'noopener'); return; }
  var w = null;
  toast('Abriendo ' + a.nombre + '…');
  api(a.img ? 'verImagen' : 'verAdjunto', S.token, a.id).then(function (r) {
    if (a.img) { abrirVisor(a.nombre, r, 'image/jpeg'); return; }
    if (r.grande) { window.open(r.url, '_blank', 'noopener'); return; }
    var bin = atob(r.b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: r.tipo || 'application/octet-stream' }));
    abrirVisor(r.nombre, url, r.tipo);
  });
}
/* Visor encima de la tarea: imágenes adentro; el resto se descarga / abre con el visor del celular. */
function abrirVisor(nombreArch, url, tipo) {
  var v = document.createElement('div');
  v.style.cssText = 'position:fixed;inset:0;z-index:80;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px';
  v.innerHTML = (/^image\//.test(tipo) || /^data:image/.test(url) ? '<img src="' + url + '" style="max-width:100%;max-height:75vh;border-radius:10px">' : '<div style="color:#fff;font-weight:700;text-align:center">' + esc(nombreArch) + '</div>') +
    '<div class="acts"><a class="btn" href="' + url + '" download="' + esc(nombreArch) + '" target="_blank">' + ic('ext', 14) + 'Abrir / descargar</a><button class="btn">Cerrar</button></div>';
  v.querySelector('button').onclick = function () { v.remove(); };
  document.body.appendChild(v);
}
var M = { items: [], adj: [], subiendo: 0, alCerrar: null };
function leerImagen(file) {
  return new Promise(function (ok, mal) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.onerror = mal; img.src = r.result;
    };
    r.onerror = mal; r.readAsDataURL(file);
  });
}

/* buscador que filtra mientras escribís */
function buscador(input, caja, listaFn) {
  if (!input || input.disabled) return;
  function sinTilde(x) { return String(x).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function mostrar() {
    var q = sinTilde(input.value.trim()), l = listaFn();
    var res = l.filter(function (n) { return !q || sinTilde(n).indexOf(q) >= 0; }).sort(function (a, b) { return (sinTilde(a).indexOf(q) !== 0) - (sinTilde(b).indexOf(q) !== 0) || a.localeCompare(b); }).slice(0, 40);
    var exacto = l.some(function (n) { return sinTilde(n) === q; });
    caja.innerHTML = res.map(function (n) { return '<div class="op">' + esc(n) + '</div>'; }).join('') +
      (q && !exacto ? '<div class="op nuevo">+ Sumar «' + esc(input.value.trim()) + '» como proveedor nuevo</div>' : '') +
      (!res.length && !q ? '<div class="op vacio">Sin proveedores</div>' : '');
    caja.style.display = 'block';
    Array.prototype.forEach.call(caja.querySelectorAll('.op'), function (o) {
      o.onmousedown = function (ev) { ev.preventDefault(); if (!o.classList.contains('nuevo') && !o.classList.contains('vacio')) input.value = o.textContent; caja.style.display = 'none'; };
    });
  }
  input.addEventListener('focus', mostrar);
  input.addEventListener('input', mostrar);
  input.addEventListener('blur', function () { setTimeout(function () { caja.style.display = 'none'; }, 150); });
}

  /* ---------- grabación (sirve para todas) ----------
   * Mientras graba, cada segundo de audio se guarda también en el celular. Si entra una llamada,
   * se bloquea el teléfono o se cierra la app, la grabación no se pierde: aparece para enviarla.
   */
  function grabar(btn, estado, alTerminar, capA, capV) {
    if (grabando()) { R.rec.stop(); return; }
    if (R.ocupado) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { sinMicrofono(estado, capA, capV); return; }
    var stream, chunks = [], t0, timer, wake = null, recId = 'rec_' + nuevoId(), n = 0, meta;
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (s) {
      stream = s;
      var tipos = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm'];
      var tipo = tipos.find(function (t) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); }) || '';
      try { R.rec = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined); }
      catch (e) { R.rec = new MediaRecorder(stream); tipo = ''; }
      meta = { k: recId + '_meta', id: recId, obra: R.obra, tipo: tipoAct(), sub: R.tipo === 'interno' ? 'semanal' : R.sub, mime: (R.rec.mimeType || tipo || 'audio/webm').split(';')[0], inicio: Date.now(), autor: autor() };
      IDB.put('grab', meta).catch(function () {});
      R.rec.ondataavailable = function (e) {
        if (!e.data || !e.data.size) return;
        chunks.push(e.data);
        IDB.put('grab', { k: recId + '_' + ('00000' + (n++)).slice(-6), b: e.data }).catch(function () {});
      };
      R.rec.onerror = function () { try { R.rec.stop(); } catch (x) {} };
      R.rec.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        clearInterval(timer); try { wake && wake.release(); } catch (x) {}
        btn.classList.remove('on');
        var seg = Math.round((Date.now() - t0) / 1000), mime = meta.mime;
        var blob = new Blob(chunks, { type: mime });
        if (seg < 2 || blob.size < 2000) { estado('Tocá para grabar', 'La grabación quedó muy corta.'); borrarGrabacion(recId); return; }
        IDB.put('grab', Object.assign({}, meta, { fin: Date.now(), seg: seg })).catch(function () {});
        estado('Tocá para grabar', '');
        alTerminar(blob, 'grabacion.' + extAudio(mime), seg, recId);
      };
      R.rec.start(1000); t0 = Date.now(); btn.classList.add('on');
      if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }, function () {});
      var tick = function () { var s = Math.floor((Date.now() - t0) / 1000); estado('Grabando · tocá para terminar', Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2) + ' · dejá la pantalla prendida'); };
      tick(); timer = setInterval(tick, 500);
    }, function (err) {
      if (err && err.name === 'NotAllowedError' && !EN_GOOGLE) {
        estado('Tocá para grabar', 'El celular no dio permiso al micrófono. Activalo en Ajustes (Safari / Chrome → Micrófono) o usá «Subir un audio».');
        return;
      }
      sinMicrofono(estado, capA, capV);
    });
  }
  /* Dentro de Google el micrófono suele estar bloqueado: se usa la grabadora (Android) o la cámara en video (iPhone). */
  function sinMicrofono(estado, capA, capV) {
    if (ES_IOS) { estado('Tocá para grabar', 'En iPhone se abre la cámara: grabá un video hablando (solo se usa el audio).'); capV.click(); }
    else { estado('Tocá para grabar', 'Se abre la grabadora del celular.'); capA.click(); }
  }
  function extAudio(mime) { return mime.indexOf('mp4') >= 0 ? 'm4a' : mime.indexOf('ogg') >= 0 ? 'ogg' : mime.indexOf('mpeg') >= 0 || mime.indexOf('mp3') >= 0 ? 'mp3' : 'webm'; }
  function borrarGrabacion(recId) {
    if (!recId) return;
    IDB.borrarRango('grab', recId + '_', recId + '_￿').catch(function () {});
  }
  /* Grabaciones que quedaron sin enviar (se cortó, se cerró la app o falló el envío) */
  function buscarGrabaciones() {
    IDB.all('grab').then(function (todo) {
      var metas = (todo || []).filter(function (x) { return /_meta$/.test(x.k) && !grabando(); });
      if (!metas.length || !$('rgPend')) return;
      $('rgPend').innerHTML = metas.map(function (m) {
        var trozos = todo.filter(function (x) { return x.k.indexOf(m.id + '_') === 0 && !/_meta$/.test(x.k); }).length;
        var o = S.d.obras.find(function (x) { return x.carpeta === m.obra || x.codigo === m.obra; });
        var d = new Date(m.inicio);
        return '<div class="tip" style="background:var(--yel-t)" data-r="' + esc(m.id) + '">' + ic('alert', 16) + ' <b>Hay una grabación sin enviar</b> · ' + esc(o ? (o.nombre || o.codigo) : 'obra') + ' · ' + (m.tipo === 'interno' ? 'interno' : m.sub === 'reunion' ? 'reunión' : 'semanal') + ' · ' +
          d.toLocaleDateString('es-AR') + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + (m.seg ? ' · ' + Math.floor(m.seg / 60) + ':' + ('0' + m.seg % 60).slice(-2) + ' min' : ' · ' + trozos + ' s aprox.') +
          '<p class="acts" style="margin:8px 0 0"><button class="btn dark sm" data-a="enviar">Recuperar y enviar</button><button class="btn sm" data-a="borrar">Descartar</button></p></div>';
      }).join('');
      Array.prototype.forEach.call($('rgPend').querySelectorAll('[data-r]'), function (el) {
        var m = metas.find(function (x) { return x.id === el.dataset.r; });
        el.querySelector('[data-a=borrar]').onclick = function () { if (window.confirm('¿Descartar esta grabación? No se puede recuperar.')) { borrarGrabacion(m.id); el.remove(); } };
        el.querySelector('[data-a=enviar]').onclick = function () { recuperar(m); };
      });
    }, function () {});
  }
  function recuperar(m) {
    if (bloqueado()) return;
    IDB.rango('grab', m.id + '_000000', m.id + '_999999').then(function (trozos) {
      if (!trozos || !trozos.length) { toast('La grabación quedó vacía.'); borrarGrabacion(m.id); vRegistros(); return; }
      var blob = new Blob(trozos.map(function (x) { return x.b; }), { type: m.mime });

      R.obra = o.codigo; R.tipo = m.tipo === 'interno' ? 'interno' : 'cliente'; R.sub = m.sub === 'reunion' ? 'reunion' : 'semanal'; guardarPref();

    });
  }

  /* Comprime a MP3 mono 16 kHz (si no puede, va el original) */
  function comprimirAudio(blob) {
    return (async function () {
      try {
        if (!window.lamejs) throw new Error('sin compresor');
        var buf = await blob.arrayBuffer();
        var Ctx = window.AudioContext || window.webkitAudioContext, ctx = new Ctx();
        var audio = await new Promise(function (ok, mal) { ctx.decodeAudioData(buf, ok, mal); });
        if (ctx.close) ctx.close();
        var RATE = 16000, off = new OfflineAudioContext(1, Math.ceil(audio.duration * RATE), RATE);
        var src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
        var pcm = (await off.startRendering()).getChannelData(0);
        var enc = new lamejs.Mp3Encoder(1, RATE, 32), partes = [], BLOQUE = 1152, i16 = new Int16Array(BLOQUE);
        for (var i = 0; i < pcm.length; i += BLOQUE) {
          var n = Math.min(BLOQUE, pcm.length - i);
          for (var j = 0; j < n; j++) { var v = Math.max(-1, Math.min(1, pcm[i + j])); i16[j] = v < 0 ? v * 0x8000 : v * 0x7FFF; }
          var mp3 = enc.encodeBuffer(n === BLOQUE ? i16 : i16.subarray(0, n));
          if (mp3.length) partes.push(new Uint8Array(mp3));
          if (i % (BLOQUE * 200) === 0) await espera(0);
        }
        var fin = enc.flush(); if (fin.length) partes.push(new Uint8Array(fin));
        return { blob: new Blob(partes, { type: 'audio/mp3' }), nombre: 'audio.mp3' };
      } catch (e) { return { blob: blob, nombre: null }; }
    })();
  }
