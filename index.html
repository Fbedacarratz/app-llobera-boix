  /* Documento generado: link a Docs + exportar PDF (con lo que se haya retocado en Docs) */
  function tarjetaDoc(cont, o, r, extra) {
    if (!cont) return;
    cont.innerHTML = '<div class="rg-msg ok">✓ <b>' + esc(r.nombre) + '</b>' + (extra ? ' · ' + extra : '') +
      '<div class="rg-doc"><a class="btn sm" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + ic('doc', 14) + 'Abrir en Docs</a><button class="btn dark sm" type="button">' + ic('ext', 14) + 'Exportar PDF</button></div><div class="pdfr" style="margin-top:8px"></div></div>';
    var b = cont.querySelector('button'), out = cont.querySelector('.pdfr');
    b.onclick = function () {
      if (b.disabled) return;
      b.disabled = true; b.innerHTML = 'Exportando…'; out.innerHTML = '';
      call('exportarPdfRegistro', o.carpeta, r.docId).then(function (x) {
        out.innerHTML = '✓ PDF listo: <a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.nombre) + '</a>';
      }, function (e) { out.innerHTML = '<span style="color:var(--red)">No se pudo exportar: ' + errTxt(e) + '</span>'; })
        .then(function () { b.disabled = false; b.innerHTML = ic('ext', 14) + 'Exportar PDF'; });
    };
  }

  /* fecha: la semana elegida en "Semana del" (vacío = esta semana) */
  function cargarSemana(o, fecha) {
    var tipo = tipoAct();
    fecha = fecha || ($('rgFecha') && $('rgFecha').value) || '';
    call('infoRegistro', o.carpeta, tipo, fecha).then(function (r) {
      if (!$('rgResp') || R.obra !== o.codigo || tipoAct() !== tipo) return;
      if (fecha && $('rgFecha').value && $('rgFecha').value !== fecha) return;     // ya eligieron otra semana
      $('rgCont').textContent = r.notasSemana + (r.notasSemana === 1 ? ' nota' : ' notas');
      if ($('rgCli') && !$('rgCli').value) $('rgCli').value = r.cliente || o.cliente || '';
      if (!$('rgResp').value) $('rgResp').value = r.responsable || autor();
      if (!$('rgFecha').value) $('rgFecha').value = r.hoy;
      if ($('rgSem')) $('rgSem').textContent = r.semana || '';
      $('rgPlan').href = r.planilla;
      if (r.ultimo && !$('rgPdf').innerHTML) tarjetaDoc($('rgPdf'), o, r.ultimo, 'último generado de esa semana');
    }, function (e) { aviso('rgEstado', 'No se pudo cargar el registro: ' + errTxt(e), 'err'); });
    cargarNotas(o, fecha);
  }

  function cargarNotas(o, fecha) {
    var tipo = tipoAct();
    fecha = fecha || ($('rgFecha') && $('rgFecha').value) || '';
    pon('rgNotas', '<div class="empty">Cargando…</div>');
    call('notasSemana', o.carpeta, tipo, fecha).then(function (notas) {
      if (!$('rgNotas') || R.obra !== o.codigo || tipoAct() !== tipo) return;
      if (fecha && $('rgFecha').value && $('rgFecha').value !== fecha) return;
      if (!notas.length) { pon('rgNotas', '<div class="empty">No hay notas en esa semana.</div>'); return; }
      $('rgNotas').innerHTML = '';
      notas.forEach(function (n) {
        var total = SECC.reduce(function (a, s) { return a + ((n.secciones[s.id] || []).length); }, 0);
        var d = document.createElement('div');
        d.className = 'task rg-nota';
        var delCliente = tipo === 'interno' && n.registro === 'cliente';
        d.innerHTML = '<div class="tx"><div class="tt">' + esc(n.fecha) + ' · ' + esc(n.autor) + (delCliente ? ' <span class="chip t-blue" style="font-size:10px">del cliente</span>' : '') + '</div><div class="tm">' + esc(n.transcripcion || '') + '</div></div><span class="chip plain">' + total + ' ítems</span>';
        d.onclick = function () { editorNota(o, n, $('rgEditor'), n.fecha + ' · ' + n.autor); $('rgEditor').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
        $('rgNotas').appendChild(d);
      });
    }, function (e) { pon('rgNotas', '<div class="rg-msg err">No se pudieron cargar las notas: ' + errTxt(e) + '</div>'); });
  }

  function editorNota(o, nota, cont, titulo) {
    if (!cont) return;
    cont.innerHTML = '<div class="rg-ed"><div class="eyebrow">' + esc(titulo) + '</div><div class="secs"></div>' +
      '<h3>Texto original <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)">(lo que dijiste o escribiste; se puede corregir)</span></h3><textarea class="orig" rows="3">' + esc(nota.transcripcion || '') + '</textarea>' +
      '<p class="acts" style="margin-top:14px"><button class="btn dark" type="button">Guardar cambios</button></p><div class="est"></div></div>';
    var leer = editorItems(cont.querySelector('.secs'), SECC, nota.secciones);
    var orig = cont.querySelector('.orig'); ajustar(orig);
    var b = cont.querySelector('.btn.dark');
    b.onclick = function () {
      var datos = leer();
      b.disabled = true; b.textContent = 'Guardando…';
      call('guardarEdicion', o.carpeta, nota.id, datos, orig.value.trim()).then(function () {
        nota.secciones = datos; nota.transcripcion = orig.value.trim();
        cont.querySelector('.est').innerHTML = '<div class="rg-msg ok">✓ Cambios guardados.</div>';
        cargarNotas(o);
      }, function (e) { cont.querySelector('.est').innerHTML = '<div class="rg-msg err">No se pudo guardar: ' + errTxt(e) + '</div>'; })
        .then(function () { b.disabled = false; b.textContent = 'Guardar cambios'; });
    };
  }

  async function nuevaNota(o, blob, nombre, recId, autorNota) {
    if (R.ocupado) return;
    R.ocupado = true;
    var tipo = tipoAct();
    var estado = function (t, s) { pon('rgRt', esc(t)); pon('rgRs', esc(s || '')); };
    if ($('rgRec')) $('rgRec').disabled = true;
    aviso('rgEstado', ''); pon('rgResultado', '');
    estado('Preparando el audio…', 'No cierres la app.');
    try {
      var c = await comprimirAudio(blob);
      if (c.blob.size > 18 * 1024 * 1024) throw new Error('El archivo es muy pesado. Grabá notas más cortas (hasta 10 minutos)');
      estado('Transcribiendo y ordenando…', 'Puede tardar hasta un minuto. No cierres la app.');
      var b64 = await leerBase64(c.blob), id = recId || nuevoId(), r, intentos = 0;
      while (true) {
        try { r = await call('procesarNota', o.carpeta, autorNota || autor(), b64, c.blob.type || blob.type || '', c.nombre || nombre || '', id, tipo); break; }
        catch (e) {
          if (++intentos >= 4 || /SESION|no válid|Falta la clave/.test(e.message)) throw e;
          estado('Reintentando el envío…', 'Intento ' + (intentos + 1) + ' de 4'); await esperarConexion(3000 * intentos);
        }
      }
      borrarGrabacion(recId);
      if ($('rgPend')) buscarGrabaciones();
      aviso('rgEstado', '✓ Nota guardada en ' + esc(o.nombre || o.codigo) + (tipo === 'interno' ? ' (interno)' : '') + '. Revisala y corregí si hace falta.', 'ok');
      if (R.obra === o.codigo && tipoAct() === tipo) { editorNota(o, r, $('rgResultado'), 'Así quedó ordenada'); if ($('rgFecha') && $('rgFecha').value !== hoyISO()) { $('rgFecha').value = ''; pon('rgPdf', ''); } cargarSemana(o); }
    } catch (e) {
      aviso('rgEstado', 'No se pudo enviar la nota: ' + errTxt(e) + '.<br><b>El audio no se perdió.</b> <a href="#" id="rgRetry">Reintentar ahora</a>', 'err');
      var ret = $('rgRetry');
      if (ret) ret.onclick = function (ev) { ev.preventDefault(); nuevaNota(o, blob, nombre, recId, autorNota); };
      if (!recId) guardarFallido(blob, nombre, o, tipo);
    }
    estado('Tocá para grabar', '');
    if ($('rgRec')) $('rgRec').disabled = false;
    R.ocupado = false;
  }
  /* un audio subido que no se pudo enviar queda guardado como "grabación sin enviar" */
  function guardarFallido(blob, nombre, o, tipo) {
    var id = 'rec_' + nuevoId();
    IDB.put('grab', { k: id + '_000000', b: blob }).then(function () {
      return IDB.put('grab', { k: id + '_meta', id: id, obra: o.codigo, tipo: tipo, sub: 'semanal', mime: blob.type || 'audio/mp4', inicio: Date.now(), autor: autor() });
    }).catch(function () {});
  }

  async function notaEscrita(o) {
    var texto = $('rgTexto').value.trim();
    if (!texto) { $('rgTexto').focus(); return; }
    if (R.ocupado) return;
    R.ocupado = true;
    var tipo = tipoAct(), limpiar = R.limpiarBorrador;
    var b = $('rgTxtBtn'); b.disabled = true; b.textContent = 'Ordenando la nota…';
    aviso('rgEstado', ''); pon('rgResultado', '');
    try {
      var id = nuevoId(), r, intentos = 0;
      while (true) {
        try { r = await call('procesarTexto', o.carpeta, autor(), texto, id, tipo); break; }
        catch (e) { if (++intentos >= 4 || /SESION|no válid|vacía/.test(e.message)) throw e; await esperarConexion(3000 * intentos); }
      }
      if (limpiar) limpiar();
      if ($('rgTexto') && R.obra === o.codigo && tipoAct() === tipo) $('rgTexto').value = '';
      aviso('rgEstado', '✓ Nota guardada' + (tipo === 'interno' ? ' (interno)' : '') + '. Revisala y corregí si hace falta.', 'ok');
      if (R.obra === o.codigo && tipoAct() === tipo) { editorNota(o, r, $('rgResultado'), 'Así quedó ordenada'); if ($('rgFecha') && $('rgFecha').value !== hoyISO()) { $('rgFecha').value = ''; pon('rgPdf', ''); } cargarSemana(o); }
    } catch (e) {
      aviso('rgEstado', 'No se pudo guardar: ' + errTxt(e) + '. El texto sigue en el cuadro (y guardado en el celular).', 'err');
    }
    if ($('rgTxtBtn')) { $('rgTxtBtn').disabled = false; $('rgTxtBtn').textContent = 'Guardar nota escrita'; }
    R.ocupado = false;
  }

  function generarSemana(o) {
    var b = $('rgGen'), tipo = tipoAct();
    if (b.disabled) return;
    b.disabled = true; b.textContent = 'Generando…'; pon('rgPdf', '');
    call('generarRegistro', o.carpeta, $('rgFecha').value, $('rgCli') ? $('rgCli').value.trim() : '', $('rgResp').value.trim(), tipo).then(function (r) {
      tarjetaDoc($('rgPdf'), o, r, r.notas + ' notas, ' + r.items + ' ítems');
    }, function (e) { aviso('rgPdf', 'No se pudo generar: ' + errTxt(e), 'err'); }).then(function () {
      if ($('rgGen')) { $('rgGen').disabled = false; $('rgGen').textContent = 'Generar documento de la semana'; }
    });
  }

  /* ================= REUNIÓN ================= */
  function reunion(o) {
    $('rgBody').innerHTML = '<div class="grid">' +
      '<div class="card c7"><div class="ch">' + ic('users') + '<h2>Reunión con el cliente</h2></div>' +
      '<div class="tip"><b>1.</b> Grabá la reunión, subí el audio y/o escribí tus notas. <b>2.</b> Tocá <b>Armar resumen</b>: salen resumen, acuerdos, pendientes, esquemas y una propuesta. <b>3.</b> Revisás y generás el documento en Docs; desde ahí exportás el PDF.</div>' +
      '<div class="form2"><div><label>Fecha de la reunión</label><input id="rvFecha" type="date" value="' + hoyISO() + '"></div>' +
      '<div><label>Quiénes estuvieron</label><input id="rvAsist" placeholder="Opcional"></div></div>' +
      '<div class="rg-grab"><button class="rg-rec" id="rvRec" aria-label="Grabar">' + MIC + '</button><div class="rg-rt" id="rvRt">Tocá para grabar</div><div class="muted" id="rvRs"></div></div>' +
      '<input id="rvFile" type="file" accept="audio/*,video/*,.ogg,.opus,.m4a,.mp3,.aac,.wav" hidden><input id="rvCapA" type="file" accept="audio/*" capture hidden><input id="rvCapV" type="file" accept="video/*" capture="user" hidden>' +
      '<div id="rvAudio"></div>' +
      '<label>O escribí a mano (notas de la reunión, o pegá una transcripción)</label><textarea id="rvTexto" rows="5" placeholder="Notas de la reunión… (quedan guardadas aunque cierres la app)"></textarea>' +
      '<p class="acts" style="margin-top:12px"><button class="btn dark" id="rvArmar">' + ic('spark', 16) + 'Armar resumen</button><label class="btn" for="rvFile" style="margin:0">' + ic('up', 16) + 'Subir un audio</label></p>' +
      '<p class="muted" style="line-height:1.5">Sirve con audio, con notas escritas o con las dos cosas. Para reuniones muy largas también podés grabar con la app de notas de voz del celular y tocar <b>Subir un audio</b>.</p>' +
      '<div id="rvEstado"></div><div id="rvEditor"></div></div>' +
      '<div class="card c5" style="align-self:start"><div class="ch">' + ic('cal') + '<h2>Reuniones de la obra</h2></div>' +
      '<div class="muted">Tocá una para revisarla, generar el documento o exportar el PDF. Se guardan en 09 - REGISTRO SEMANAL / REUNIONES.</div>' +
      '<div id="rvLista" class="list" style="margin-top:10px"><div class="empty">Cargando…</div></div></div></div>';

    pintarAudio();
    var recBtn = $('rvRec');
    var estado = function (t, s) { pon('rvRt', esc(t)); pon('rvRs', esc(s || '')); };
    recBtn.onclick = function () {
      grabar(recBtn, estado, function (b, n, seg, recId) {
        R.audioReu = { blob: b, nombre: n, etiqueta: 'grabación de ' + Math.floor(seg / 60) + ':' + ('0' + seg % 60).slice(-2) + ' min', recId: recId };
        pintarAudio();
      }, $('rvCapA'), $('rvCapV'));
    };
    ['rvFile', 'rvCapA', 'rvCapV'].forEach(function (id) {
      $(id).onchange = function (e) { var f = (e.target.files || [])[0]; e.target.value = ''; if (f) { R.audioReu = { blob: f, nombre: f.name || 'reunion.m4a', etiqueta: f.name }; pintarAudio(); } };
    });
    R.limpiarBorradorReu = borrador($('rvTexto'), 'reu');
    ajustar($('rvTexto'));
    $('rvArmar').onclick = function () { armar(o); };
    cargarReuniones(o);
    call('infoRegistro', o.carpeta, 'cliente').then(function (r) { R.cliente = r.cliente || o.cliente || ''; R.resp = r.responsable || autor(); }, function () {});
  }

  function pintarAudio(sub) {
    if (!$('rvAudio')) return;
    if (!R.audioReu) { $('rvAudio').innerHTML = sub ? '<p class="muted">' + esc(sub) + '</p>' : ''; return; }
    $('rvAudio').innerHTML = '<div class="rg-msg ok" style="display:flex;justify-content:space-between;gap:10px"><span>✓ Audio listo · ' + esc(R.audioReu.etiqueta || R.audioReu.nombre) + ' · ' +
      (R.audioReu.blob.size / 1048576).toFixed(1) + ' MB</span><a href="#" id="rvQuitar">quitar</a></div>';
    $('rvQuitar').onclick = function (e) { e.preventDefault(); if (R.audioReu.recId && !window.confirm('¿Descartar la grabación?')) return; if (R.audioReu.recId) borrarGrabacion(R.audioReu.recId); R.audioReu = null; pintarAudio(); };
  }

  function cargarReuniones(o) {
    call('listarReuniones', o.carpeta).then(function (lista) {
      if (!$('rvLista') || R.obra !== o.codigo) return;
      if (!lista.length) { pon('rvLista', '<div class="empty">Todavía no hay reuniones cargadas.</div>'); return; }
      $('rvLista').innerHTML = '';
      lista.forEach(function (r) {
        var d = document.createElement('div');
        d.className = 'task rg-nota';
        d.innerHTML = '<div class="tx"><div class="tt">' + esc(r.fecha) + ' · ' + esc(r.res.titulo || 'Reunión') + '</div><div class="tm">' + esc(r.res.resumen || '') + '</div></div>' +
          '<span class="chip ' + (r.doc ? 'st-Terminado' : 'plain') + '">' + (r.doc ? 'DOC' : 'sin doc') + '</span>';
        d.onclick = function () { editorReunion(o, r); $('rvEditor').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
        $('rvLista').appendChild(d);
      });
    }, function (e) { pon('rvLista', '<div class="rg-msg err">No se pudieron cargar: ' + errTxt(e) + '</div>'); });
  }

  async function subirAudio(o, fecha, blob, nombre, avance) {
    var total = blob.size;
    var ini = await call('iniciarAudioReunion', o.carpeta, fecha, blob.type || '', nombre || '', total);
    for (var desde = 0; desde < total;) {
      var hasta = Math.min(desde + PARTE, total), b64 = await leerBase64(blob.slice(desde, hasta)), intentos = 0;
      while (true) {
        try { await call('subirParteAudioReunion', ini.clave, b64, desde); break; }
        catch (e) { if (++intentos >= 3) throw e; await espera(2000 * intentos); }
      }
      desde = hasta; avance(Math.round(desde / total * 100));
    }
    return ini.clave;
  }

  async function armar(o) {
    var b = $('rvArmar');
    if (R.ocupado || b.disabled) return;
    if (grabando()) { aviso('rvEstado', 'Terminá la grabación primero.', 'err'); return; }
    var texto = $('rvTexto').value.trim();
    if (!R.audioReu && !texto) { aviso('rvEstado', 'Grabá o subí el audio, o escribí notas de la reunión.', 'err'); return; }
    R.ocupado = true; b.disabled = true;
    var fecha = $('rvFecha').value || hoyISO(), datos = { fecha: fecha, asistentes: $('rvAsist').value.trim(), texto: texto, autor: autor() }, recId = R.audioReu && R.audioReu.recId, limpiar = R.limpiarBorradorReu;
    pon('rvEditor', ''); aviso('rvEstado', '');
    try {
      var clave = '';
      if (R.audioReu) {
        var blob = R.audioReu.blob, nombre = R.audioReu.nombre;
        if (blob.size <= 20 * 1024 * 1024) {            // los audios chicos se comprimen; los largos van tal cual
          b.textContent = 'Preparando el audio…';
          var c = await comprimirAudio(blob);
          if (c.nombre) { blob = c.blob; nombre = 'reunion.mp3'; }
        }
        clave = await subirAudio(o, fecha, blob, nombre, function (p) { if ($('rvArmar')) $('rvArmar').textContent = 'Subiendo el audio · ' + p + '%'; });
      }
      if ($('rvArmar')) $('rvArmar').textContent = 'Armando el resumen…';
      aviso('rvEstado', 'Puede tardar unos minutos según el largo de la reunión. No cierres la app.', 'ok');
      var id = nuevoId(), r, intentos = 0;
      while (true) {                     // si se corta la conexión reintenta (no se duplica)
        try { r = await call('armarReunion', o.carpeta, datos, clave, id); break; }
        catch (e) {
          if (++intentos >= 4 || /SESION|no válid|Falta|venció|Cargá|ya no está|no pudo leer/.test(e.message)) throw e;
          await esperarConexion(4000 * intentos);
        }
      }
      R.audioReu = null;
      borrarGrabacion(recId);
      if (limpiar) limpiar();
      if (R.obra === o.codigo && $('rvEditor')) {
        pintarAudio(); $('rvTexto').value = ''; $('rvAsist').value = '';
        aviso('rvEstado', '✓ Resumen armado. Revisalo, corregí lo que haga falta y generá el documento.', 'ok');
        editorReunion(o, r); cargarReuniones(o);
      } else toast('Resumen de reunión listo en ' + (o.nombre || o.codigo) + '.');
      transcribir(o, r.id);
    } catch (e) {
      aviso('rvEstado', 'No se pudo armar el resumen: ' + errTxt(e) + '. <b>El audio y las notas siguen cargados</b>: tocá Armar resumen de nuevo.', 'err');
    }
    if ($('rvArmar')) { $('rvArmar').disabled = false; $('rvArmar').innerHTML = ic('spark', 16) + 'Armar resumen'; }
    R.ocupado = false;
  }

  // La transcripción va aparte (al doc de CITAS) para no demorar el resumen
  function transcribir(o, id) {
    var linea = function (t) { var el = document.querySelector('.rg-ed[data-id="' + id + '"] .citas'); if (el) el.textContent = t; };
    linea('Guardando la transcripción en el doc de CITAS…');
    call('transcribirReunion', o.carpeta, id).then(function () { linea('✓ Transcripción guardada en el doc de CITAS.'); },
      function (e) { linea('La transcripción no se pudo guardar en CITAS (' + ((e && e.message) || e) + '). El resumen está bien.'); });
  }

  function textoEsquema(e) {
    if (e.tipo === 'comparacion') return 'Comparación: ' + e.columnas.join(' / ') + ' · ' + e.filas.map(function (f) { return f.criterio; }).join(', ');
    return (e.tipo === 'cronograma' ? 'Cronograma: ' : 'Pasos: ') + e.pasos.map(function (p) { return (p.fecha ? p.fecha + ' ' : '') + p.titulo; }).join(' → ');
  }

  function editorReunion(o, reu) {
    var cont = $('rvEditor'); if (!cont) return;
    var r = reu.res, p = r.propuesta || { titulo: '', texto: '', puntos: [] };
    cont.innerHTML = '<div class="rg-ed" data-id="' + esc(reu.id) + '"><div style="display:flex;justify-content:space-between;gap:10px"><div class="eyebrow">Reunión del ' + esc(reu.fecha) + '</div>' +
      '<span>' + (reu.doc ? '<a class="muted" href="' + esc(reu.doc) + '" target="_blank" rel="noopener">Doc</a>' : '') + (reu.pdf ? ' · <a class="muted" href="' + esc(reu.pdf) + '" target="_blank" rel="noopener">PDF</a>' : '') + '</span></div>' +
      '<label>Título</label><input class="rTit" value="' + esc(r.titulo) + '">' +
      '<label>Asistentes</label><input class="rAsi" value="' + esc(r.asistentes.length ? r.asistentes.join(', ') : reu.asistentes) + '">' +
      '<label>Resumen</label><textarea class="rRes" rows="4">' + esc(r.resumen) + '</textarea>' +
      '<div class="secs"></div>' +
      '<h3>Esquemas</h3>' + (r.esquemas.length ? r.esquemas.map(function (e, i) {
        return '<label class="chk"><input type="checkbox" data-e="' + i + '"' + (e.incluir !== false ? ' checked' : '') + '><span><b>' + esc(e.titulo) + '</b><br><span class="muted">' + esc(textoEsquema(e)) + '</span></span></label>';
      }).join('') : '<div class="muted">No hizo falta ninguno para esta reunión.</div>') +
      '<h3>Propuesta sugerida</h3><input class="pTit" placeholder="Título" value="' + esc(p.titulo) + '">' +
      '<textarea class="pTex" rows="3" placeholder="Texto" style="margin-top:8px">' + esc(p.texto) + '</textarea>' +
      '<textarea class="pPun" rows="4" placeholder="Un punto por línea" style="margin-top:8px">' + esc(p.puntos.join('\n')) + '</textarea>' +
      '<label class="chk"><input type="checkbox" class="conProp"' + (reu.conPropuesta !== false ? ' checked' : '') + '><span>Incluir la propuesta en el documento</span></label>' +
      '<label class="chk"><input type="checkbox" class="sumar"' + (reu.sumar !== false ? ' checked' : '') + '><span>Sumar acuerdos y pendientes también al registro semanal del cliente (al interno van siempre)</span></label>' +
      '<div class="form2" style="margin-top:6px"><div><label>Cliente</label><input class="rCli" value="' + esc(R.cliente || o.cliente || '') + '"></div>' +
      '<div><label>Responsable del estudio</label><input class="rResp" value="' + esc(R.resp || autor()) + '"></div></div>' +
      '<p class="acts" style="margin-top:14px"><button class="btn dark rPdf" type="button">Guardar y generar documento</button><button class="btn rGua" type="button">Solo guardar</button></p>' +
      '<div class="est"></div><div class="docr"></div><p class="muted citas">' + (reu.citas ? '✓ Transcripción en el doc de CITAS.' : '') + '</p>' +
      (reu.audio ? '<p class="muted"><a href="' + esc(reu.audio) + '" target="_blank" rel="noopener">Audio de la reunión</a></p>' : '') + '</div>';
    var card = cont.querySelector('.rg-ed');
    Array.prototype.forEach.call(card.querySelectorAll('.rRes,.pTex,.pPun'), ajustar);
    var leerSecs = editorItems(card.querySelector('.secs'), RSEC, r);
    var leer = function () {
      var res = leerSecs();
      res.titulo = card.querySelector('.rTit').value.trim();
      res.resumen = card.querySelector('.rRes').value.trim();
      res.asistentes = card.querySelector('.rAsi').value.split(/\s*[,;]\s*/).filter(Boolean);
      res.esquemas = r.esquemas.map(function (e, i) { return Object.assign({}, e, { incluir: card.querySelector('[data-e="' + i + '"]').checked }); });
      res.propuesta = { titulo: card.querySelector('.pTit').value.trim(), texto: card.querySelector('.pTex').value.trim(),
        puntos: card.querySelector('.pPun').value.split('\n').map(function (x) { return x.replace(/^\s*[-•\d.)]+\s*/, '').trim(); }).filter(Boolean) };
      return res;
    };
    var est = function (t, tipo) { card.querySelector('.est').innerHTML = t ? '<div class="rg-msg ' + tipo + '">' + t + '</div>' : ''; };
    var guardar = function () {
      var res = leer(), op = { sumar: card.querySelector('.sumar').checked, conPropuesta: card.querySelector('.conProp').checked, asistentes: card.querySelector('.rAsi').value.trim() };
      return call('guardarReunion', o.carpeta, reu.id, res, op).then(function () { reu.res = res; reu.sumar = op.sumar; reu.conPropuesta = op.conPropuesta; });
    };
    var bG = card.querySelector('.rGua'), bP = card.querySelector('.rPdf');
    bG.onclick = function () {
      bG.disabled = true; est('');
      guardar().then(function () { est('✓ Cambios guardados.', 'ok'); cargarReuniones(o); }, function (e) { est('No se pudo guardar: ' + errTxt(e), 'err'); })
        .then(function () { bG.disabled = false; });
    };
    bP.onclick = function () {
      if (bP.disabled) return;
      bP.disabled = true; bP.textContent = 'Generando…'; est('');
      R.cliente = card.querySelector('.rCli').value.trim(); R.resp = card.querySelector('.rResp').value.trim();
      guardar().then(function () { return call('generarReunion', o.carpeta, reu.id, R.cliente, R.resp); }).then(function (x) {
        reu.doc = x.url; reu.docId = x.docId;
        tarjetaDoc(card.querySelector('.docr'), o, x, 'retocalo en Docs si hace falta y exportá el PDF');
        cargarReuniones(o);
      }, function (e) { est('No se pudo generar: ' + errTxt(e), 'err'); }).then(function () { bP.disabled = false; bP.textContent = 'Guardar y generar documento'; });
    };
    if (reu.docId) tarjetaDoc(card.querySelector('.docr'), o, { url: reu.doc, docId: reu.docId, nombre: 'Documento de la reunión' }, 'ya generado');
  }
})();

/* ---------- página propia: funciona como app instalada ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
/* ---------- arranque ---------- */
if (S.token) {
  recargar().catch(function () {});
  setTimeout(function () { if (document.body.classList.contains('arranca')) $('spErr').classList.add('on'); }, 15000);
} else document.body.classList.remove('arranca');
</script>
